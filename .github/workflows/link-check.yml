name: Link Check

on:
  schedule:
    # Run every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'index.html'
      - '.github/workflows/link-check.yml'

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Link Check with lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --exclude-all-private
            --exclude-link-local
            --exclude-mail
            --max-concurrency 5
            --timeout 20
            --accept 200,206,429
            --scheme https
            README.md
            index.html
          fail: true
          output: lychee/out.md

      - name: Create GitHub Issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try {
              body = fs.readFileSync('lychee/out.md', 'utf8');
            } catch (e) {
              body = 'Link check failed but report file was not found.';
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Broken links detected — ${new Date().toISOString().slice(0, 10)}`,
              body: body.substring(0, 60000) + '\n\n> Auto-generated by the weekly link-check workflow.',
              labels: ['link-check', 'automated']
            });
