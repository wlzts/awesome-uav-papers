<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Awesome UAV Papers — 检索</title>
<style>
:root {
  --bg: #f8f9fa; --card: #fff; --border: #e2e8f0;
  --text: #1a202c; --text2: #64748b; --accent: #0e7c6b;
  --accent-light: #e6f7f4; --tag-bg: #f1f5f9;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }

/* Header */
.header { text-align: center; padding: 40px 20px 20px; }
.header h1 { font-size: 28px; margin-bottom: 8px; }
.header h1 a { color: var(--accent); text-decoration: none; }
.header p { color: var(--text2); font-size: 15px; }
.stats { margin-top: 12px; font-size: 13px; color: var(--text2); }
.stats span { margin: 0 8px; }

/* Search */
.search-box { max-width: 600px; margin: 20px auto; position: relative; }
.search-box input { width: 100%; padding: 12px 16px 12px 44px; border: 2px solid var(--border); border-radius: 10px; font-size: 15px; outline: none; transition: border-color .2s; }
.search-box input:focus { border-color: var(--accent); }
.search-box::before { content: "🔍"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 16px 0; padding: 12px; background: var(--card); border-radius: 10px; border: 1px solid var(--border); }
.filter-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.filter-group label { font-size: 13px; color: var(--text2); font-weight: 600; }
.chip { padding: 4px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: var(--tag-bg); color: var(--text); transition: all .15s; user-select: none; }
.chip:hover { border-color: var(--accent); }
.chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Results count */
.result-info { text-align: center; color: var(--text2); font-size: 13px; margin: 12px 0; }

/* Cards grid */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; margin-top: 16px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; transition: box-shadow .2s, transform .15s; }
.card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); transform: translateY(-2px); }
.card-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.card-title a { color: var(--accent); text-decoration: none; }
.card-title a:hover { text-decoration: underline; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
.badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.badge-year { background: #fef3c7; color: #92400e; }
.badge-type { background: #dbeafe; color: #1e40af; }
.badge-cat { background: var(--accent-light); color: var(--accent); }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.tag { padding: 1px 6px; background: var(--tag-bg); border-radius: 3px; font-size: 11px; color: var(--text2); }
.card-authors { font-size: 12px; color: var(--text2); margin-bottom: 6px; font-style: italic; }
.card-zh { font-size: 13px; color: var(--text); margin-bottom: 8px; line-height: 1.5; }
.card-links { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; padding-top: 8px; border-top: 1px solid var(--border); }
.card-links a { color: var(--accent); text-decoration: none; }
.card-links a:hover { text-decoration: underline; }
.card-links .na { color: #cbd5e1; }

/* Footer */
.footer { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 13px; }
.footer a { color: var(--accent); }

@media (max-width: 600px) {
  .cards { grid-template-columns: 1fr; }
  .header h1 { font-size: 22px; }
}
</style>
</head>

const CATS = [...new Set(PAPERS.map(p => p.cat).filter(Boolean))].sort();
const YEARS = [...new Set(PAPERS.map(p => p.y).filter(Boolean))].sort().reverse();
const TYPES = [...new Set(PAPERS.map(p => p.ty).filter(Boolean))].sort();

let activeCat = '', activeYear = '', activeType = '', query = '';

// Build filter chips
function buildFilters() {
  const fc = document.getElementById('filters');
  const groups = [
    {label: '方向', items: ['', ...CATS], get: () => activeCat, set: v => activeCat = v},
    {label: '年份', items: ['', ...YEARS], get: () => activeYear, set: v => activeYear = v},
    {label: '类型', items: ['', ...TYPES], get: () => activeType, set: v => activeType = v},
  ];
  fc.innerHTML = groups.map(g => {
    const chips = g.items.map(it => {
      const label = it === '' ? '全部' : it;
      const active = g.get() === it;
      return `<span class="chip ${active?'active':''}" data-group="${g.label}" data-val="${it}">${label}</span>`;
    }).join('');
    return `<div class="filter-group"><label>${g.label}:</label>${chips}</div>`;
  }).join('');
}

document.getElementById('filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const group = chip.dataset.group;
  const val = chip.dataset.val;
  if (group === '方向') activeCat = val;
  else if (group === '年份') activeYear = val;
  else if (group === '类型') activeType = val;
  buildFilters();
  render();
});

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value.toLowerCase().trim();
  render();
});

function match(p) {
  if (activeCat && p.cat !== activeCat) return false;
  if (activeYear && String(p.y) !== String(activeYear)) return false;
  if (activeType && p.ty !== activeType) return false;
  if (query) {
    const hay = (p.t + ' ' + p.a + ' ' + p.v + ' ' + p.zh + ' ' + (p.tags||[]).join(' ')).toLowerCase();
    if (!hay.includes(query)) return false;
  }
  return true;
}

function render() {
  const filtered = PAPERS.filter(match);
  document.getElementById('stats').innerHTML =
    `共 <b>${PAPERS.length}</b> 篇论文` +
    CATS.map(c => ` · ${c}: ${PAPERS.filter(p=>p.cat===c).length}`).join('');
  document.getElementById('resultInfo').textContent = `显示 ${filtered.length} / ${PAPERS.length} 篇`;

  const grid = document.getElementById('cards');
  if (filtered.length === 0) {
    grid.innerHTML = '<p style="text-align:center;color:#94a3b8;padding:40px;">没有匹配的论文，试试其他关键词。</p>';
    return;
  }
  grid.innerHTML = filtered.map(p => {
    const title = p.t || 'Untitled';
    const url = p.u && p.u !== '#' ? p.u : '#';
    const tagsHtml = (p.tags||[]).map(t => `<span class="tag">${t}</span>`).join('');
    const doiHtml = p.doi && p.doi !== 'N/A'
      ? (p.doi.startsWith('http') ? `<a href="${p.doi}" target="_blank">📜 DOI</a>` : `<span title="${p.doi}">📜 DOI</span>`)
      : '<span class="na">📜 DOI: N/A</span>';
    const codeHtml = p.code && p.code !== 'N/A'
      ? `<a href="${p.code}" target="_blank">💻 Code</a>`
      : '<span class="na">💻 Code: N/A</span>';
    const dataHtml = p.data && p.data !== 'N/A'
      ? `<a href="${p.data}" target="_blank">📊 Data</a>`
      : '';
    return `<div class="card">
      <div class="card-title"><a href="${url}" target="_blank">${title}</a></div>
      <div class="card-meta">
        <span class="badge badge-year">${p.y}</span>
        <span class="badge badge-type">${p.ty}</span>
        ${p.cat ? `<span class="badge badge-cat">${p.cat}</span>` : ''}
      </div>
      <div class="card-tags">${tagsHtml}</div>
      <div class="card-authors">${p.a}${p.v ? ' · ' + p.v : ''}</div>
      <div class="card-zh">${p.zh || ''}</div>
      <div class="card-links">${doiHtml}${codeHtml}${dataHtml}</div>
    </div>`;
  }).join('');
}

buildFilters();
render();
</script>
